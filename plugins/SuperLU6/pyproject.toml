[build-system]
requires = [
    "scikit-build-core",
    "cmake>=3.18",
    "ninja",
    "pybind11",
     "ug4py-base>=0.4.0" # contains libug4.so, libCompile.so
]
build-backend = "scikit_build_core.build"

[project]
name = "ug4py-plugins-superlu"
version = "0.1.1"
description = "This is UG4-plugin for SuperLU6."
readme = {file = "README.md", content-type = "text/markdown"}
dependencies = [
    "ug4py-base>=0.4.1" # 0.4 offers dylibs
]


[tool.scikit-build]
#  cf. https://github.com/scikit-build/scikit-build-core

# The versions of CMake to allow. If CMake is not present on the system or does
# not pass this specifier, it will be downloaded via PyPI if possible. An empty
# string will disable this check.
cmake.version = ">=3.15"
cmake.source-dir = "ug4-git/plugins/SuperLU6"  # ← final CMakeLists.txt will be in this subdir!

# Setting DUG_ROOT_CMAKE_PATH is important!
cmake.args=['-DBUILD_WITH_PIP=ON', '-DUG_ROOT_CMAKE_PATH=/project/ug4-git/ugcore/cmake', '-DCMAKE_POSITION_INDEPENDENT_CODE=ON', '-DTARGET=pyugcore','-DPARALLEL:BOOL=OFF','-DCPU=1'] 

logging.level = "DEBUG"
